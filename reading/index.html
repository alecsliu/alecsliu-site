<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading · Alec Liu</title>
  <meta name="theme-color" content="#12301f">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <nav class="crumbs"><a href="../index.html">Alec Liu</a><span class="sep">/</span>Reading</nav>

    <h1>Reading</h1>

    <!-- Optional: write a paragraph here, between <p> and </p>. Delete these lines if you don't want one.
    <p class="intro">Your text here.</p>
    -->

    <p class="count" id="count"></p>
    <div id="books"><p class="status">Loading books from Goodreads…</p></div>

    <script>
      (function () {
        var box = document.getElementById("books");
        var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

        fetch("../api/goodreads")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!data.configured) { box.innerHTML = '<p class="status">Goodreads isn\'t connected yet.</p>'; return; }
            if (data.error || !data.books.length) { box.innerHTML = '<p class="status">Couldn\'t load books right now. Try again later.</p>'; return; }

            document.getElementById("count").textContent = data.books.length + " books";

            // Group by year finished
            var groups = {}, order = [];
            data.books.forEach(function (b) {
              var y = b.finished ? new Date(b.finished).getUTCFullYear() : "Undated";
              if (!groups[y]) { groups[y] = []; order.push(y); }
              groups[y].push(b);
            });

            box.innerHTML = order.map(function (y) {
              return "<h2>" + y + "</h2><ul class=\"books\">" + groups[y].map(function (b) {
                var d = b.finished ? new Date(b.finished) : null;
                var when = d ? months[d.getUTCMonth()] + " " + d.getUTCDate() : "";
                return "<li><span class=\"book\"><a href=\"" + esc(b.link) + "\" target=\"_blank\" rel=\"noopener\">" + esc(b.title) +
                       "</a><span class=\"by\">" + esc(b.author) + "</span></span><span class=\"when\">" + when + "</span></li>";
              }).join("") + "</ul>";
            }).join("");
          })
          .catch(function () { box.innerHTML = '<p class="status">Couldn\'t load books right now. Try again later.</p>'; });
      })();
    </script>

    <footer>© 2026 Alec Liu</footer>
  </main>
</body>
</html>
