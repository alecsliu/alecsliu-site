<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading · Alec Liu</title>
  <meta name="theme-color" content="#12301f">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <nav class="crumbs"><a href="../index.html">Alec Liu</a><span class="sep">/</span>Reading</nav>

    <h1>Reading</h1>

    <!-- Optional: write a paragraph here, between <p> and </p>. Delete these lines if you don't want one.
    <p class="intro">Your text here.</p>
    -->

    <h2>Recently finished</h2>
    <div id="books"><p class="status">Loading books from Goodreads…</p></div>

    <script>
      (function () {
        var box = document.getElementById("books");
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
        function fail() { box.innerHTML = '<p class="status">Couldn\'t load books right now. Try again later.</p>'; }

        fetch("../api/goodreads")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error || !data.books || !data.books.length) return fail();
            box.innerHTML = '<ul class="covers">' + data.books.map(function (b) {
              var art = b.cover ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy">' : "<span>" + esc(b.title) + "</span>";
              return '<li><a href="' + esc(b.link) + '" target="_blank" rel="noopener"><span class="art">' + art +
                     '</span><span class="cap">' + esc(b.title) + (b.author ? "<small>" + esc(b.author) + "</small>" : "") + "</span></a></li>";
            }).join("") + "</ul>";
          })
          .catch(fail);
      })();
    </script>

    <footer>© 2026 Alec Liu</footer>
  </main>
</body>
</html>
