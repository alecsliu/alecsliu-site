<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading · Alec Liu</title>
  <meta name="theme-color" content="#12301f">
  <link rel="icon" href="../favicon-dragon.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <nav class="crumbs"><a href="../index.html">Alec Liu</a><span class="sep">/</span>Reading</nav>

    <h1>Reading</h1>

    <p class="intro">10 most recent books I've read.</p>

    <div id="books"><p class="status">Loading books from Goodreads…</p></div>

    <script src="../reading/notes.js"></script>
    <script>
      (function () {
        var box = document.getElementById("books");
        var notes = window.READING_NOTES || {};
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
        function norm(x) { return String(x).normalize("NFC").replace(/[\u2018\u2019]/g, "'").trim().toLowerCase(); }
        function noteFor(title) {
          var t = norm(title);
          for (var k0 in notes) { if (norm(k0) === t && String(notes[k0]).trim()) return notes[k0]; }
          var keys = Object.keys(notes).sort(function (a, b) { return b.length - a.length; });
          for (var i = 0; i < keys.length; i++) {
            var k = norm(keys[i]);
            if (k && t.indexOf(k) !== -1 && String(notes[keys[i]]).trim()) return notes[keys[i]];
          }
          return "";
        }
        function fail() { box.innerHTML = '<p class="status">Couldn\'t load books right now. Try again later.</p>'; }

        fetch("../api/goodreads")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error || !data.books || !data.books.length) return fail();
            box.innerHTML = '<ul class="reads">' + data.books.map(function (b) {
              var art = b.cover ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy">' : "";
              var note = noteFor(b.title);
              return '<li><a class="cover" href="' + esc(b.link) + '" target="_blank" rel="noopener">' + art + '</a>' +
                     '<div class="info"><a class="t" href="' + esc(b.link) + '" target="_blank" rel="noopener">' + esc(b.title) + '</a>' +
                     (b.author ? '<span class="by">' + esc(b.author) + '</span>' : '') + '</div>' +
                     '<div class="comment">' + note + '</div></li>';
            }).join("") + "</ul>";
          })
          .catch(fail);
      })();
    </script>

    <footer>
      <ul class="social">
        <li><a href="https://www.goodreads.com/user/show/160897919" target="_blank" rel="noopener" aria-label="Goodreads"><span class="icon icon-goodreads" aria-hidden="true"></span>Goodreads</a></li>
        <!-- SUBSTACK: paste your Substack address in place of the # below, then delete "hidden". -->
        <li hidden><a href="#" target="_blank" rel="noopener" aria-label="Substack"><span class="icon icon-substack" aria-hidden="true"></span>Substack</a></li>
      </ul>
      © 2026 Alec Liu
    </footer>
  </main>
</body>
</html>
