name: Update page dates
on:
  push:
    branches: [main]
    paths: ["**.html", "!templates/**"]
permissions:
  contents: write
jobs:
  stamp:
    if: "!contains(github.event.head_commit.message, 'Update page dates')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/stamp_dates.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update page dates"
            git push
          fi
